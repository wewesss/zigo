name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Checkout the release bundle readme
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow-ref
          sparse-checkout: .github/release-readme.md
          sparse-checkout-cone-mode: false

      - name: Set up Lua 5.4
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Build the bundled distribution
        run: lua build.lua

      - name: Sanity check — run tests against the bundle
        run: lua tests/run.lua dist

      - name: Stage the release tree
        run: |
          set -euo pipefail
          STAGE="release/zigo-${REF_NAME}"
          mkdir -p "${STAGE}/zigo-type"

          cp dist/zigo.lua     "${STAGE}/"
          cp dist/zigo.min.lua "${STAGE}/"

          cp types/*.d.lua "${STAGE}/zigo-type/"

          cp workflow-ref/.github/release-readme.md "${STAGE}/README.md"
          cp LICENSE                   "${STAGE}/"

          ls -la "${STAGE}"
          ls -la "${STAGE}/zigo-type"

      - name: Create the zip archive
        run: |
          set -euo pipefail
          cd release
          zip -r "../zigo-${REF_NAME}.zip" "zigo-${REF_NAME}"
          cd ..
          ls -la "zigo-${REF_NAME}.zip"

      - name: Create the GitHub release (draft) and upload the zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REF_NAME }}
          name: zigo ${{ env.REF_NAME }}
          draft: true
          generate_release_notes: true
          files: zigo-${{ env.REF_NAME }}.zip
